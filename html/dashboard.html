  </aside>

  <main class="main-content">

      <div class="topbar-left">
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
        <div class="page-title">

      </div>
    </header>
    <div class="content-area" id="content-area"></div>
  </main>

  function getCurrentUser() {
    try {
      const raw = localStorage.getItem('user');
      const isAuthenticated = localStorage.getItem('isAuthenticated') === 'true';
      if (!raw || !isAuthenticated) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function usernameFromEmail(email) { if (!email) return ''; return email.includes('@') ? email.split('@')[0] : email; }
  const currentUser = getCurrentUser();
  const currentEmail = currentUser ? (currentUser.email || '') : '';
  const currentUsername = currentUser ? usernameFromEmail(currentEmail) : '';
  const currentInitial = (currentUsername || currentEmail || '?').charAt(0).toUpperCase();

  function paintUserChrome() {

    document.getElementById('topbar-user-name').textContent = nameToShow;
    document.getElementById('topbar-user-email').textContent = currentEmail || '—';
  }
  function logout() {
    localStorage.removeItem('user');
    localStorage.removeItem('isAuthenticated');
    localStorage.removeItem('activeNav');
    localStorage.removeItem('settings');
    window.location.href = 'login.html';
  }

  function getSavedNav() {
    try { const saved = localStorage.getItem('activeNav'); if (saved && pageMap[saved]) return saved; } catch (e) {}
    return 'dashboard';
  }
  function loadSettings() {
    const defaults = { notifications: true, emailDigest: false, darkMode: true, language: "English" };
    try { const raw = localStorage.getItem('settings'); if (raw) return Object.assign(defaults, JSON.parse(raw)); } catch (e) {}
    return defaults;
  }
  function saveSettings() { try { localStorage.setItem('settings', JSON.stringify(state.settings)); } catch (e) {} }

  function fmt(n) { return "$" + n.toLocaleString(); }
  function go404() { window.location.href = "404.html"; }

  function animateStatBars(){
    requestAnimationFrame(() => {
      document.querySelectorAll('.stat-bar-fill, .progress-fill').forEach(el => {
        const target = el.getAttribute('data-w');
        if (target) el.style.width = target + '%';
      });
    });
  }
  function gsapEntrance(){
    if (typeof gsap === 'undefined') return;
    gsap.killTweensOf('.stat-card, .card, .team-card, .pub-card, .research-card');
    gsap.set('.stat-card', { opacity: 0, y: 18 });
    gsap.to('.stat-card', { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out', stagger: 0.06 });
    gsap.set('.card, .team-card, .pub-card, .research-card', { opacity: 0, y: 22 });
    gsap.to('.card, .team-card, .pub-card, .research-card', { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', stagger: 0.05, delay: 0.08 });
    document.querySelectorAll('.stat-value').forEach(el => {
      const raw = el.textContent.trim();
      const match = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
      if (!match) return;
      const prefix = match[1], numStr = match[2].replace(/,/g, ''), suffix = match[3];
      const num = parseFloat(numStr);
      if (isNaN(num)) return;
      const isInt = Number.isInteger(num) && !numStr.includes('.');
      const counter = { val: 0 };
      gsap.to(counter, {
        val: num, duration: 1.1, ease: 'power2.out', delay: 0.15,
        onUpdate: () => { const shown = isInt ? Math.round(counter.val).toLocaleString() : counter.val.toFixed(1); el.textContent = prefix + shown + suffix; },
        onComplete: () => { el.textContent = raw; }
      });
    });
  }

        <td><span class="status-badge ${statusColors[t.status]}">${t.status}</span></td>
        <td><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" data-w="${t.progress}"></div></div><span class="progress-pct">${t.progress}%</span></div></td>
        <td class="date-col" style="font-size:12px">${t.instructor}</td>
        <td class="date-col">${t.endDate}</td>
        <td class="budget-col">${t.credits}</td>
      </tr>`).join("");

    return `<section class="stats-grid">${statsHtml}</section>
      <div class="card">
        <div class="card-header"><div><h2 class="card-title">Risk Register</h2><p class="card-sub">Full risk list across categories</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${filterHtml}</div></div>
        <div class="table-wrapper"><table class="runs-table"><thead><tr><th>Risk</th><th>Category</th><th>Type</th><th>Status</th><th>Mitigation</th><th>Owner</th><th>Next Review</th><th>Severity</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
  }

  function renderTeams() {
    const stats = [
      { value: riskAnalysts.length, label: "Risk Analysts", bar: 80 },
      { value: riskAnalysts.filter(m => m.status === "active").length, label: "On Duty Today", bar: 85, accent: true },
      { value: riskAnalysts.reduce((a, m) => a + m.courses, 0), label: "Cases Handled", bar: 70 },
      { value: Math.round(riskAnalysts.reduce((a, m) => a + m.experience, 0) / riskAnalysts.length), label: "Avg. Yrs at Stackly", bar: 75 }
    ];
    const statsHtml = stats.map((s, i) => `<div class="stat-card ${s.accent ? "stat-accent" : ""}" onclick="go404()">
        <div class="stat-top"></div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div></div>`).join("");

    const cards = riskAnalysts.map((m, i) => `<div class="team-card" onclick="go404()">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
          <div class="member-avatar" style="width:46px;height:46px;font-size:14px">${m.avatar}<span class="online-dot dot-${m.status}"></span></div>
          <div><div class="member-name" style="font-size:15px">${m.name}</div><div class="member-role">${m.role}</div></div>
        </div>
        <div class="team-card-meta">
          <div>${m.speciality}</div>
          <div>${m.email}</div>
          <div>${m.courses} case${m.courses !== 1 ? "s" : ""} handled · ${m.experience} yrs experience</div>
        </div>
      </div>`).join("");

    return `<section class="stats-grid">${statsHtml}</section>
      <div class="card"><div class="card-header"><div><h2 class="card-title">Analyst Directory</h2><p class="card-sub">Every category, every owner</p></div></div>
      <div class="team-grid">${cards}</div></div>`;
  }

  function renderProducts() {
    const q = state.productSearch.toLowerCase();
    const filtered = actionItems.filter(a => a.name.toLowerCase().includes(q) || a.dept.toLowerCase().includes(q));
    const stats = [
      { value: "412", label: "Action Items Tracked", bar: 75, accent: true },
      { value: "86", label: "Awaiting Review", bar: 55 },
      { value: "54", label: "Resolved This Term", bar: 30 },
      { value: "12", label: "Overdue", bar: 20 }
    ];
    const statsHtml = stats.map((s, i) => `<div class="stat-card ${s.accent ? "stat-accent" : ""}" onclick="go404()">
        <div class="stat-top"></div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div></div>`).join("");

    const badgeBg = { "In Progress": "rgba(232,41,156,.14)", "Open": "rgba(255,255,255,.08)", "Closed": "rgba(34,197,94,.14)" };
    const badgeColor = { "In Progress": "var(--pink)", "Open": "var(--text-dim)", "Closed": "var(--green)" };

    const rows = filtered.map(a => `<tr onclick="go404()">
        <td class="type-col mono-cell">${a.id}</td>
        <td><div class="t-name">${a.name}</div><div class="t-sub">${a.dept}</div></td>
        <td class="date-col">${a.category}</td>
        <td class="date-col">${a.date}</td>
        <td><span style="color:${urgencyColor[a.urgency]};font-weight:700;font-size:12px">${a.urgency}</span></td>
        <td><span class="status-badge" style="background:${badgeBg[a.status]};color:${badgeColor[a.status]}">${a.status}</span></td>
      </tr>`).join("");

    return `<section class="stats-grid">${statsHtml}</section>
      <div class="card">
        <div class="card-header"><div><h2 class="card-title">Action Item Board</h2><p class="card-sub">Mitigation work across every category</p></div>
        <div class="search-box" style="flex:0 0 auto"><span class="search-icon">⌕</span><input id="product-search-input" placeholder="Search action items…" value="${state.productSearch}"></div></div>
        <div class="table-wrapper"><table class="runs-table"><thead><tr><th>ID</th><th>Action Item</th><th>Type</th><th>Assigned</th><th>Priority</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
  }

  function renderReports() {
    const stats = [
      { value: riskReports.length, label: "Reports on File", bar: 80, accent: true },
      { value: riskReports.filter(p => p.status === "Published").length, label: "Published", bar: 70 },
      { value: riskReports.filter(p => p.status === "In Review").length, label: "In Review", bar: 20 },
      { value: riskReports.reduce((a, p) => a + p.reads, 0), label: "Total Views", bar: 60 }
    ];
    const statsHtml = stats.map((s, i) => `<div class="stat-card ${s.accent ? "stat-accent" : ""}" onclick="go404()">
        <div class="stat-top"></div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div></div>`).join("");

    const cards = riskReports.map((p, i) => `<div class="research-card" onclick="go404()">
        <div class="research-card-row">
          <div class="research-card-main">
            <div class="research-card-title">${p.title}</div>
            <div class="research-card-authors">${p.authors}</div>
            <div class="research-card-journal">${p.journal} · ${p.year}</div>
          </div>
          <div class="research-card-side">
            <span class="research-status-badge" style="background:${reportStatusColor[p.status]}1a;color:${reportStatusColor[p.status]}">${p.status}</span>
            ${p.reads > 0 ? `<span class="research-reads">${p.reads} views</span>` : ''}
          </div>
        </div>
      </div>`).join("");

    return `<section class="stats-grid">${statsHtml}</section>
      <div class="card"><div class="card-header"><div><h2 class="card-title">Risk Reports</h2><p class="card-sub">Assessments &amp; category summaries</p></div></div>
      <div class="research-list">${cards}</div></div>`;
  }

  function renderSchedule() {
    const rows = monitoringCalendar.map(ev => {
      const parts = ev.date.split(" ");
      let tag = "";
      if (ev.type === "urgent") tag = `<span class="evt-tag" style="background:rgba(239,68,68,.14);color:#ef4444">Urgent</span>`;
      if (ev.type === "meeting") tag = `<span class="evt-tag" style="background:rgba(45,212,191,.14);color:#2dd4bf">Meeting</span>`;
      return `<div class="schedule-row" onclick="go404()">
        <div class="schedule-date-col">
          <div class="schedule-month" style="color:${scheduleTypeColor[ev.type]}">${parts[0]}</div>
          <div class="schedule-day">${parts[1]}</div>
        </div>
        <div class="schedule-bar" style="background:${scheduleTypeColor[ev.type]}"></div>
        <div class="schedule-body">
          <div class="schedule-event">${ev.event}</div>
          <div class="schedule-site">${ev.site}</div>
        </div>${tag}
      </div>`;
    }).join("");
    return `<div class="card"><div class="card-header"><div><h2 class="card-title">Monitoring Calendar</h2><p class="card-sub">Reviews, audits, and key dates ahead</p></div></div>
      <div class="schedule-list">${rows}</div></div>`;
  }

  function renderBudget() {
    const totalAllocated = budgetData.reduce((a, b) => a + b.allocated, 0);
    const totalSpent = budgetData.reduce((a, b) => a + b.spent, 0);
    const remaining = totalAllocated - totalSpent;
    const utilRate = Math.round((totalSpent / totalAllocated) * 100);
    const stats = [
      { value: fmt(totalAllocated), label: "Total Allocated", bar: 100, accent: true },
      { value: fmt(totalSpent), label: "Total Spent", bar: utilRate },
      { value: fmt(remaining), label: "Remaining", bar: Math.round((remaining / totalAllocated) * 100) },
      { value: utilRate + "%", label: "Utilisation Rate", bar: utilRate }
    ];
    const statsHtml = stats.map((s, i) => `<div class="stat-card ${s.accent ? "stat-accent" : ""}" onclick="go404()">
        <div class="stat-top"></div><div class="stat-value" style="font-size:22px">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div></div>`).join("");

    const rows = budgetData.map(b => {
      const pct = Math.round((b.spent / b.allocated) * 100);
      const barGrad = pct > 85 ? "linear-gradient(90deg,#ef4444,#f97316)" : "linear-gradient(90deg,#e8299c,#9c1568)";
      return `<div class="budget-row" onclick="go404()">
        <div class="budget-row-top">
          <div><span class="budget-row-name">${b.site}</span>
          <span class="region-tag budget-row-tag" style="color:${riskCategoryAccents[b.dept]};border-color:${riskCategoryAccents[b.dept]};background:${riskCategoryAccents[b.dept]}1a;">${b.dept}</span></div>
          <div class="budget-row-figures"><span class="budget-spent">${fmt(b.spent)}</span> / ${fmt(b.allocated)}
          <span class="budget-pct" style="color:${pct > 80 ? "#ef4444" : "var(--pink)"};">${pct}%</span></div>
        </div>
        <div class="budget-bar-track">
          <div class="progress-fill" data-w="${pct}" style="background:${barGrad};height:100%;"></div>
        </div>
      </div>`;
    }).join('');

    return `<section class="stats-grid">${statsHtml}</section>
      <div class="card"><div class="card-header"><div><h2 class="card-title">Budget &amp; Spend by Category</h2><p class="card-sub">Allocation vs spend this term</p></div></div>
      <div class="budget-list">${rows}</div></div>`;
  }

  function renderTraining() {
    const stats = [
      { value: resourceLibrary.length, label: "Titles Available", bar: 80, accent: true },
      { value: resourceLibrary.reduce((a, p) => a + p.downloads, 0).toLocaleString(), label: "Total Downloads", bar: 90 },
      { value: resourceLibrary.reduce((a, p) => a + p.pages, 0).toLocaleString(), label: "Total Pages", bar: 65 },
      { value: "2025", label: "Latest Edition", bar: 100 }
    ];
    const statsHtml = stats.map((s, i) => `<div class="stat-card ${s.accent ? "stat-accent" : ""}" onclick="go404()">
        <div class="stat-top"></div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div></div>`).join("");

    const cards = resourceLibrary.map((pub, i) => `<div class="pub-card" onclick="go404()">
        <div class="pub-card-title">${pub.title}</div>
        <div class="pub-card-meta">${pub.type} · ${pub.year} · ${pub.pages} pages</div>
        <div class="pub-card-footer">
          <span class="pub-downloads">${pub.downloads.toLocaleString()} downloads</span>
          <button class="btn-outline pub-view-btn" onclick="event.stopPropagation();go404()">View</button>
        </div>
      </div>`).join("");

    return `<section class="stats-grid">${statsHtml}</section>
      <div class="card"><div class="card-header"><div><h2 class="card-title">Resource Library</h2><p class="card-sub">Playbooks, guides, and reference material</p></div></div>
      <div class="pub-grid">${cards}</div></div>`;
  }

  function toggleHtml(id, value) {
    return `<div class="toggle-switch" data-toggle="${id}" style="background:${value ? "var(--pink)" : "var(--border)"}">
      <div class="toggle-knob" style="left:${value ? "20px" : "3px"}"></div></div>`;
  }

  function renderSettings() {
    const s = state.settings;
    const displayName = currentUsername || currentEmail || "Signed out";
    const displayEmail = currentEmail || "No account signed in";
    return `
      <div class="card"><div class="card-header"><div><h2 class="card-title">Account</h2><p class="card-sub">Signed-in profile</p></div></div>
        <div class="account-row">
          <div class="account-avatar">${currentInitial}</div>
          <div><div class="account-name">${displayName}</div>
          <div class="account-email">${displayEmail}</div>
          <div class="account-role">${currentUser ? (currentUser.role === 'admin' ? 'Administrator account' : 'User account') : 'Not signed in'}</div></div>
        </div>
        <button class="btn-outline" onclick="go404()">Edit Profile</button>
      </div>
      <div class="card"><div class="card-header"><div><h2 class="card-title">Preferences</h2><p class="card-sub">Notifications and display</p></div></div>
        <div>
          <div class="pref-row">
            <div><div class="pref-title">Push Notifications</div><div class="pref-desc">Alerts for new risk signals and status changes</div></div>
            ${toggleHtml("notifications", s.notifications)}
          </div>
          <div class="pref-row">
            <div><div class="pref-title">Weekly Digest</div><div class="pref-desc">Summary of category activity every Monday</div></div>
            ${toggleHtml("emailDigest", s.emailDigest)}
          </div>
          <div class="pref-row">
            <div><div class="pref-title">Dark Mode</div><div class="pref-desc">Use a darker colour scheme across the console</div></div>
            ${toggleHtml("darkMode", s.darkMode)}
          </div>
          <div class="pref-row pref-row-last">
            <div><div class="pref-title">Language</div><div class="pref-desc">Interface display language</div></div>
            <select class="pref-select" id="lang-select">${["English", "French", "Spanish", "Mandarin", "Portuguese"].map(l => `<option ${s.language === l ? "selected" : ""}>${l}</option>`).join("")}</select>
          </div>
        </div>
      </div>
      <div class="card"><div class="card-header"><div><h2 class="card-title">Session</h2><p class="card-sub">Sign out of this account on this device</p></div></div>
        <div class="session-row">
          <div class="session-text">Signed in as <strong>${displayEmail}</strong>. Signing out will clear this session and return you to the sign-in screen.</div>
          <button class="btn-outline btn-danger" id="settings-logout-btn">Sign out</button>
        </div>
      </div>
      <div class="card"><div class="card-header"><div><h2 class="card-title">Danger Zone</h2><p class="card-sub">Irreversible account actions</p></div></div>
        <div class="danger-row">
          <button class="btn-outline btn-danger" onclick="go404()">Reset Password</button>
          <button class="btn-outline btn-danger" onclick="go404()">Delete Account</button>
        </div>
      </div>`;
  }

  const pageRenderers = { dashboard: renderDashboard, runs: renderRuns, teams: renderTeams, products: renderProducts, reports: renderReports, schedule: renderSchedule, budget: renderBudget, training: renderTraining, settings: renderSettings };

  function renderNav() {
    const mainItems = navItems.slice(0, 6);
    const mgmtItems = navItems.slice(6);
    function itemHtml(item) {
      const badge = item.id === "runs" ? `<span class="nav-badge">8</span>` : "";
      return `<button class="nav-item ${state.activeNav === item.id ? "nav-active" : ""}" data-nav="${item.id}"><span>${item.label}</span>${badge}</button>`;
    }
    document.getElementById("nav-main").innerHTML = mainItems.map(itemHtml).join("");
    document.getElementById("nav-management").innerHTML = mgmtItems.map(itemHtml).join("");
  }

  function renderPage() {
    const page = pageMap[state.activeNav];
    document.getElementById("page-title-text").textContent = page.title;
    document.getElementById("page-sub-text").textContent = page.sub;
    document.getElementById("content-area").innerHTML = pageRenderers[state.activeNav]();
    renderNav();
    const settingsLogoutBtn = document.getElementById("settings-logout-btn");
    if (settingsLogoutBtn) settingsLogoutBtn.addEventListener("click", logout);
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    animateStatBars();
    gsapEntrance();
  }

  function navigateTo(id) {
    state.activeNav = id;
    try { localStorage.setItem('activeNav', id); } catch (e) {}
    closeSidebar();
    closeTopbarUserMenu();
    renderPage();
  }

  function openSidebar() { document.getElementById("sidebar").classList.add("sidebar-open"); document.getElementById("sidebar-overlay").classList.add("show"); }
  function closeSidebar() { document.getElementById("sidebar").classList.remove("sidebar-open"); document.getElementById("sidebar-overlay").classList.remove("show"); }
  function closeTopbarUserMenu() { document.getElementById("topbar-user").classList.remove("open"); }

  document.getElementById("hamburger-btn").addEventListener("click", openSidebar);
  document.getElementById("close-sidebar-btn").addEventListener("click", closeSidebar);
  document.getElementById("brand-home-btn").addEventListener("click", function() { navigateTo("dashboard"); });
  document.getElementById("sidebar-overlay").addEventListener("click", closeSidebar);
  document.getElementById("notif-btn").addEventListener("click", go404);
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-user-btn").addEventListener("click", function(e) { e.stopPropagation(); document.getElementById("topbar-user").classList.toggle("open"); });
  document.addEventListener("click", closeTopbarUserMenu);

  document.addEventListener("click", function(e) {
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
    const filterBtn = e.target.closest(".run-filter-btn");
    if (filterBtn) { state.runFilter = filterBtn.getAttribute("data-filter"); renderPage(); return; }
    const toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      const key = toggle.getAttribute("data-toggle");
      state.settings[key] = !state.settings[key];
      saveSettings();
      const value = state.settings[key];
      toggle.style.background = value ? "var(--pink)" : "var(--border)";
      const knob = toggle.querySelector(".toggle-knob");
      if (knob) knob.style.left = value ? "20px" : "3px";
      return;
    }
  });

  document.addEventListener("input", function(e) {
    if (e.target && e.target.id === "product-search-input") {
      state.productSearch = e.target.value;
      const caretPos = e.target.selectionStart;
      renderPage();
      const input = document.getElementById("product-search-input");
      if (input) { input.focus(); input.setSelectionRange(caretPos, caretPos); }
    }
  });

  document.addEventListener("change", function(e) {
    if (e.target && e.target.id === "lang-select") { state.settings.language = e.target.value; saveSettings(); }
  });

  paintUserChrome();
  if (typeof gsap !== 'undefined') {
    gsap.from('#topbar', { y: -14, opacity: 0, duration: 0.5, ease: 'power2.out' });
  }
  renderPage();
</script>
</body>
</html>
