  /* =========================================================
     SIGNED-IN USER LOOKUP
     Reads the account whatever key and shape the login page used:
     the usual key names in localStorage then sessionStorage, a JSON
     object or a bare email string, nested objects, and finally a
     sweep of every stored key. JSON is parsed before anything is
     treated as an address, because a serialized object has no
     spaces and would otherwise match a loose email pattern.
     ========================================================= */
  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
  const USER_KEY_CANDIDATES = [
    'user', 'currentUser', 'loggedInUser', 'authUser', 'stacklyUser',
    'userData', 'profile', 'account', 'auth', 'session',
    'userEmail', 'email', 'username'
  ];
  const EMAIL_FIELDS = ['email', 'mail', 'useremail', 'emailaddress', 'e-mail', 'username', 'login', 'user'];
  const NAME_FIELDS = ['name', 'fullname', 'displayname', 'firstname', 'givenname'];
  const ROLE_FIELDS = ['role', 'userrole', 'accounttype', 'type'];
  let foundUserKey = null;

  function asEmail(v) {
    if (typeof v !== 'string') return null;
    const s = v.trim();
    return EMAIL_RE.test(s) ? s : null;
  }

  function objToUser(obj, depth) {
    depth = depth || 0;
    if (!obj || depth > 4) return null;
    if (typeof obj === 'string') {
      const direct = asEmail(obj);
      if (direct) return { email: direct };
      return rawToUser(obj, depth + 1);
    }
    if (Array.isArray(obj)) {
      for (let i = 0; i < obj.length; i++) {
        const hit = objToUser(obj[i], depth + 1);
        if (hit) return hit;
      }
      return null;
    }
    if (typeof obj !== 'object') return null;
    // Pass 1 — likeliest field names, matched case-insensitively so
    // "Email", "EMAIL" and "email" all work.
    for (const k in obj) {
      if (EMAIL_FIELDS.indexOf(String(k).toLowerCase()) === -1) continue;
      const hit = asEmail(obj[k]);
      if (hit) return Object.assign({}, obj, { email: hit });
    }
    // Pass 2 — any other string value that is an address.
    for (const k in obj) {
      const hit = asEmail(obj[k]);
      if (hit) return Object.assign({}, obj, { email: hit });
    }
    // Pass 3 — nested objects and nested JSON strings.
    for (const k in obj) {
      const v = obj[k];
      if (v && typeof v === 'object') {
        const nested = objToUser(v, depth + 1);
        if (nested) return nested;
      } else if (typeof v === 'string' && (v.trim().charAt(0) === '{' || v.trim().charAt(0) === '[')) {
        const nested = rawToUser(v, depth + 1);
        if (nested) return nested;
      }
    }
    return null;
  }

  function rawToUser(raw, depth) {
    depth = depth || 0;
    if (!raw || depth > 4) return null;
    const trimmed = String(raw).trim();
    if (!trimmed) return null;
    const first = trimmed.charAt(0);
    if (first === '{' || first === '[' || first === '"') {
      try { return objToUser(JSON.parse(trimmed), depth); } catch (e) { /* fall through */ }
    }
    const direct = asEmail(trimmed);
    if (direct) return { email: direct };
    try { return objToUser(JSON.parse(trimmed), depth); } catch (e) { return null; }
  }

  function pickField(obj, fields) {
    if (!obj || typeof obj !== 'object') return '';
    for (const k in obj) {
      if (fields.indexOf(String(k).toLowerCase()) === -1) continue;
      const v = obj[k];
      if (typeof v === 'string' && v.trim() && !asEmail(v)) return v.trim();
    }
    return '';
  }

  function getCurrentUser() {
    const stores = [];
    try { if (window.localStorage) stores.push(localStorage); } catch (e) {}
    try { if (window.sessionStorage) stores.push(sessionStorage); } catch (e) {}

    for (let s = 0; s < stores.length; s++) {
      try { if (stores[s].getItem('isAuthenticated') === 'false') return null; } catch (e) {}
    }
    for (let s = 0; s < stores.length; s++) {
      for (let i = 0; i < USER_KEY_CANDIDATES.length; i++) {
        const key = USER_KEY_CANDIDATES[i];
        let hit = null;
        try { hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
        if (hit) { foundUserKey = key; return hit; }
      }
    }
    for (let s = 0; s < stores.length; s++) {
      let len = 0;
      try { len = stores[s].length; } catch (e) {}
      for (let i = 0; i < len; i++) {
        let key = null, hit = null;
        try { key = stores[s].key(i); hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
        if (hit) { foundUserKey = key; return hit; }
      }
    }
    return null;
  }

  function usernameFromEmail(email) { if (!email) return ''; return email.includes('@') ? email.split('@')[0] : email; }

  const currentUser = getCurrentUser();
  const currentEmail = currentUser ? (asEmail(currentUser.email) || '') : '';
  const storedName = currentUser ? pickField(currentUser, NAME_FIELDS) : '';
  const currentRole = currentUser ? pickField(currentUser, ROLE_FIELDS).toLowerCase() : '';
  const currentUsername = (currentEmail || storedName) ? (storedName || usernameFromEmail(currentEmail)) : '';
  // First character of the email address.
  const currentInitial = ((currentEmail || currentUsername || '?').trim().charAt(0) || '?').toUpperCase();

  function paintUserChrome() {

    document.getElementById('topbar-user-name').textContent = nameToShow;

  }

  function logout() {
    const keys = ['user', 'isAuthenticated', 'activeNav', 'settings'].concat(USER_KEY_CANDIDATES);
    if (foundUserKey && keys.indexOf(foundUserKey) === -1) keys.push(foundUserKey);
    keys.forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
      try { sessionStorage.removeItem(k); } catch (e) {}
    });
    window.location.href = 'login.html';
  }

  function getSavedNav() {
    try { const saved = localStorage.getItem('activeNav'); if (saved && pageMap[saved]) return saved; } catch (e) {}
    return 'dashboard';
  }
  function loadSettings() {
    const defaults = {
      notifications: true, emailDigest: false, darkMode: true, language: "English",
      twoFactor: true, ssoRequired: true, ipAllowlist: false, autoLock: true, sessionTimeout: "30 minutes"
    };
    try { const raw = localStorage.getItem('settings'); if (raw) return Object.assign(defaults, JSON.parse(raw)); } catch (e) {}
    return defaults;
  }
  function saveSettings() { try { localStorage.setItem('settings', JSON.stringify(state.settings)); } catch (e) {} }

  let state = { activeNav: getSavedNav(), orgFilter: "All", userSearch: "", settings: loadSettings() };

  function fmt(n) { return "$" + n.toLocaleString(); }
  function go404() { window.location.href = "404.html"; }
  function regionTag(dept) { const c = riskCategoryAccents[dept] || "#e8299c"; return `<span class="region-tag" style="color:${c};border-color:${c};background:${c}1a;">${dept}</span>`; }
  function planTag(plan) { const c = planColor[plan] || "#6b6b70"; return `<span class="region-tag" style="color:${c};border-color:${c};background:${c}1a;">${plan}</span>`; }
  function statusBadge(status) { return `<span class="status-badge ${statusBadgeClass[status] || "status-field"}">${status}</span>`; }

  /* =========================================================
     TOPBAR HEIGHT
     Below 960px the header is position:fixed, so the content needs
     an equal top offset. Measuring it keeps the two in step no
     matter how the header wraps at a given width.
     ========================================================= */
  function syncTopbarHeight() {
    const tb = document.getElementById('topbar');
    if (!tb) return;
    const h = tb.offsetHeight;
    if (h) document.documentElement.style.setProperty('--topbar-h', h + 'px');
  }

  function animateStatBars(){
    requestAnimationFrame(() => {
      document.querySelectorAll('.stat-bar-fill, .progress-fill').forEach(el => {
        const target = el.getAttribute('data-w');
        if (target) el.style.width = target + '%';
      });
    });
  }
  function gsapEntrance(){
    if (typeof gsap === 'undefined') return;
    gsap.killTweensOf('.stat-card, .card, .team-card, .pub-card, .research-card');
    gsap.set('.stat-card', { opacity: 0, y: 18 });
    gsap.to('.stat-card', { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out', stagger: 0.06 });
    gsap.set('.card, .team-card, .pub-card, .research-card', { opacity: 0, y: 22 });
    gsap.to('.card, .team-card, .pub-card, .research-card', { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out', stagger: 0.05, delay: 0.08 });
    document.querySelectorAll('.stat-value').forEach(el => {
      const raw = el.textContent.trim();
      const match = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
      if (!match) return;
      const prefix = match[1], numStr = match[2].replace(/,/g, ''), suffix = match[3];
      const num = parseFloat(numStr);
      if (isNaN(num)) return;
      const isInt = Number.isInteger(num) && !numStr.includes('.');
      const counter = { val: 0 };
      gsap.to(counter, {
        val: num, duration: 1.1, ease: 'power2.out', delay: 0.15,
        onUpdate: () => { const shown = isInt ? Math.round(counter.val).toLocaleString() : counter.val.toFixed(1); el.textContent = prefix + shown + suffix; },
        onComplete: () => { el.textContent = raw; }
      });
    });
  }

  function renderDashboard() {
    const totalMrr = billingData.reduce((a, b) => a + b.mrr, 0);
    const needsAttention = organizations.filter(o => o.status !== "Active");
    const stats = [
      { delta: "+1 this month", value: String(organizations.length), label: "Organizations Onboarded", bar: 80, accent: true },
      { delta: "+12 this week", value: "213", label: "Platform Users", bar: 70 },
      { delta: "+64 this week", value: "1,167", label: "Active Risks (All Orgs)", bar: 65 },
      { delta: "+8% MoM", value: fmt(totalMrr), label: "Monthly Recurring Revenue", bar: 90 }
    ];
    const statsHtml = stats.map(s => `<div class="stat-card ${s.accent ? "stat-accent" : ""}" onclick="go404()">
        <div class="stat-top"><span></span><span class="stat-delta up">${s.delta}</span></div>
        <div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" data-w="${s.bar}"></div></div>
      </div>`).join("");

    const attentionRows = needsAttention.map(o => `<tr onclick="go404()">
        <td><div class="t-name">${o.name}</div><div class="t-sub">Joined ${o.joined}</div></td>
        <td>${planTag(o.plan)}</td>
        <td>${statusBadge(o.status)}</td>
      </tr>`).join("");

    const auditHtml = auditLog.slice(0, 5).map(a => `<li class="activity-item" onclick="go404()">
        <span class="act-icon">${a.actor === "System" ? "⚙" : a.actor.charAt(0)}</span>
        <div class="act-body"><p class="act-text"><strong>${a.actor}</strong> ${a.action.toLowerCase()} — ${a.target}</p><span class="act-time">${a.time} · ${a.org}</span></div>
      </li>`).join("");

    const healthHtml = systemServices.map(s => `<li class="activity-item" onclick="go404()">
        <span class="act-icon" style="background:${s.status === "operational" ? "rgba(34,197,94,.14)" : "rgba(239,68,68,.14)"};color:${s.status === "operational" ? "var(--green)" : "var(--red)"}">●</span>
        <div class="act-body"><p class="act-text">${s.name}</p><span class="act-time">${s.uptime} uptime · ${s.status === "operational" ? "Operational" : "Degraded"}</span></div>
      </li>`).join("");

    const taxonomyHtml = riskTaxonomy.map(t => `<li class="milestone-item" onclick="go404()">
        <div class="ms-body" style="flex:1">
          <div class="ms-event">${t.name}</div>
          <div class="progress-wrap" style="margin-top:8px"><div class="progress-bar"><div class="progress-fill" data-w="${t.weight}"></div></div><span class="progress-pct">${t.risksTracked} risks</span></div>
        </div>
      </li>`).join("");

  function navigateTo(id) {
    state.activeNav = id;
    try { localStorage.setItem('activeNav', id); } catch (e) {}
    closeSidebar();
    closeTopbarUserMenu();
    renderPage();
  }

  /* =========================================================
     SIDEBAR OPEN / CLOSE
     While the sidebar is open, .nav-open goes on <html> and
     <body>; admindashboard.css sets overflow:hidden on both so
     the page underneath can't be scrolled. The scroll position is
     saved and restored so dismissing the sidebar doesn't jump
     back to the top.
     ========================================================= */
  let savedScrollY = 0;

  function lockPageScroll() {
    savedScrollY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.classList.add("nav-open");
    document.body.classList.add("nav-open");
  }
  function unlockPageScroll() {
    if (!document.body.classList.contains("nav-open")) return;
    document.documentElement.classList.remove("nav-open");
    document.body.classList.remove("nav-open");
    window.scrollTo(0, savedScrollY);
  }

  function openSidebar() {
    document.getElementById("sidebar").classList.add("sidebar-open");
    document.getElementById("sidebar-overlay").classList.add("show");
    lockPageScroll();
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("sidebar-open");
    document.getElementById("sidebar-overlay").classList.remove("show");
    unlockPageScroll();
  }
  function closeTopbarUserMenu() { document.getElementById("topbar-user").classList.remove("open"); }

  document.getElementById("hamburger-btn").addEventListener("click", openSidebar);
  document.getElementById("close-sidebar-btn").addEventListener("click", closeSidebar);
  document.getElementById("brand-home-btn").addEventListener("click", function() { navigateTo("dashboard"); });
  document.getElementById("sidebar-overlay").addEventListener("click", closeSidebar);
  document.getElementById("notif-btn").addEventListener("click", go404);
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-user-btn").addEventListener("click", function(e) { e.stopPropagation(); document.getElementById("topbar-user").classList.toggle("open"); });
  document.addEventListener("click", closeTopbarUserMenu);

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeSidebar();
  });
  window.addEventListener("resize", function() {
    if (window.innerWidth > 960) closeSidebar();
    syncTopbarHeight();
  });
  window.addEventListener("orientationchange", syncTopbarHeight);
  window.addEventListener("load", syncTopbarHeight);
  if (document.fonts && document.fonts.ready) {
    // Web fonts change the header's height once they land.
    document.fonts.ready.then(syncTopbarHeight);
  }

  document.addEventListener("click", function(e) {
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
    const filterBtn = e.target.closest(".run-filter-btn");
    if (filterBtn) { state.orgFilter = filterBtn.getAttribute("data-org-filter"); renderPage(); return; }
    const toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      const key = toggle.getAttribute("data-toggle");
      state.settings[key] = !state.settings[key];
      saveSettings();
      const value = state.settings[key];
      toggle.style.background = value ? "var(--pink)" : "var(--border)";
      const knob = toggle.querySelector(".toggle-knob");
      if (knob) knob.style.left = value ? "20px" : "3px";
      return;
    }
  });

  document.addEventListener("input", function(e) {
    if (e.target && e.target.id === "user-search-input") {
      state.userSearch = e.target.value;
      const caretPos = e.target.selectionStart;
      renderPage();
      const input = document.getElementById("user-search-input");
      if (input) { input.focus(); input.setSelectionRange(caretPos, caretPos); }
    }
  });

  document.addEventListener("change", function(e) {
    if (e.target && e.target.id === "lang-select") { state.settings.language = e.target.value; saveSettings(); }
    if (e.target && e.target.id === "timeout-select") { state.settings.sessionTimeout = e.target.value; saveSettings(); }
  });

  paintUserChrome();
  if (typeof gsap !== 'undefined') {
    gsap.from('#topbar', { y: -14, opacity: 0, duration: 0.5, ease: 'power2.out' });
  }
  renderPage();
  syncTopbarHeight();
</script>
</body>
</html>
